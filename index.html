<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">
                <img src="img/logo.png" width="236" height="26" alt="logo">
            </a>
            <nav class="header__nav nav">
                <ul class="nav__list header__nav-list">
                    <li class="nav__item header__nav-item">
                        <a href="index.html" class="nav__item-link header__nav-link">HOME</a>
                    </li>
                    <li class="nav__item header__nav-item">
                        <a href="index.html" class="nav__item-link header__nav-link">ABOUT US</a>
                    </li>
                    <li class="nav__item header__nav-item">
                        <a href="index.html" class="nav__item-link header__nav-link">Create your plan</a>
                    </li>
                </ul>
            </nav>
            <button class="hamburger hamburger--close"></button>
        </div>
    </header>
    <main>
        <div class="intro">
            <div class="intro__container container">
                <div class="intro__content">
                    <p class="intro__slogan">
                        Great coffee
                        made simple.
                    </p>
                    <p class="intro__text">
                        Start your mornings with the world’s best coffees. Try our expertly curated artisan coffees from our best roasters delivered directly to your door, at your schedule.
                    </p>
                    <a href="index.html" class="create-link">Create your plan</a>
                </div>
            </div>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
